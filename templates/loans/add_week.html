{% extends "base.html" %}
{% block title %}Add week — Loan #{{ loan.id }}{% endblock %}
{% block content %}
<h1 class="page-title">Add week — Loan #{{ loan.id }}</h1>
<p class="text-muted">Borrower: <a href="{{ url_for('borrowers_view', borrower_id=loan.borrower_id) }}">{{ loan.borrower.name }}</a></p>

<div class="card-panel col-lg-7">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Pay date *</label>
      <input type="date" name="due_date" class="form-control" required value="{{ suggested_date }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Interest</label>
      <input type="number" step="0.01" min="0" name="interest" class="form-control" value="{{ default_interest }}">
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Extra type</label>
        <select name="extra_type" class="form-select" id="extra_type">
          <option value="none">None</option>
          <option value="interest">Extra interest</option>
          <option value="fine">Fine</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Extra amount</label>
        <input type="number" step="0.01" min="0" name="extra_amount" class="form-control" value="0">
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Add week</button>
      <a href="{{ url_for('loans_view', loan_id=loan.id) }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
