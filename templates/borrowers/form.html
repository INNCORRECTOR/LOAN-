{% extends "base.html" %}
{% block title %}{{ title }} — TIA LOAN COMPANY{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="card-panel col-lg-7 mt-3">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input type="text" name="name" class="form-control" required value="{{ borrower.name if borrower else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ borrower.phone if borrower and borrower.phone else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" name="address" class="form-control" value="{{ borrower.address if borrower and borrower.address else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Notes</label>
      <textarea name="notes" class="form-control" rows="3">{{ borrower.notes if borrower and borrower.notes else '' }}</textarea>
    </div>
    {% if borrower %}
    <div class="mb-3">
      <label class="form-label">Status</label>
      <select name="status" class="form-select">
        <option value="active" {% if borrower.status == 'active' %}selected{% endif %}>Active</option>
        <option value="inactive" {% if borrower.status == 'inactive' %}selected{% endif %}>Inactive</option>
      </select>
    </div>
    {% endif %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% if borrower %}{{ url_for('borrowers_view', borrower_id=borrower.id) }}{% else %}{{ url_for('borrowers_list') }}{% endif %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
